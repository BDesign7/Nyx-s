
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NYX S | Concept Car</title>
  <style>
    :root {
      --nardo: #a4a6a9;
      --creme: #f3ecda;
      --dark: #0e0e0e;
      --rouge: #c70039;
    }
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: var(--dark);
      color: var(--creme);
    }
    header {
      padding: 60px 20px;
      text-align: center;
      background: linear-gradient(to right, var(--nardo), #7c7f83);
    }
    .logo {
      display: inline-flex;
      align-items: center;
      font-size: 2.8em;
      font-weight: bold;
      letter-spacing: 2px;
    }
    .logo span {
      margin-left: 8px;
      background: var(--dark);
      color: var(--rouge);
      padding: 5px 12px;
      border-radius: 6px;
      font-weight: 700;
    }
    h2 {
      font-size: 2em;
      margin-top: 40px;
      color: var(--creme);
    }
    section {
      padding: 40px 20px;
      max-width: 1000px;
      margin: auto;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      align-items: center;
    }
    img {
      max-width: 100%;
      border-radius: 12px;
    }
    footer {
      text-align: center;
      padding: 20px;
      background: var(--nardo);
      font-size: 0.9em;
      color: #111;
    }
    .cta {
      background: #ffffff10;
      padding: 20px;
      border-radius: 10px;
      margin-top: 30px;
      text-align: center;
    }
    .cta a {
      color: var(--creme);
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">NYX<span>S</span></div>
    <p>Concept-car furtif et intemporel</p>
  </header>
</body>
</html>
